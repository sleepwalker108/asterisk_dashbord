; Окремий AMI-користувач для дашборду.
; Покласти на сервері Asterisk у /etc/asterisk/manager.d/dashboard.conf
; (manager.conf уже містить #include "manager.d/*.conf")
; Потім: asterisk -rx "manager reload"   — дзвінки й інші AMI-підключення це не зачіпає.

[dashboard]
secret = ЗГЕНЕРУЙТЕ_ДОВГИЙ_ПАРОЛЬ
; підключатися можна лише з віртуалки дашборду
deny = 0.0.0.0/0.0.0.0
permit = IP_ВІРТУАЛКИ/255.255.255.255
; call — дзвінки (Join/Leave/Hangup), agent — події черг, dialplan — Newexten (щоб бачити IVR)
read = call,agent,dialplan
; agent — лише QueuePause / QueueAdd / QueueRemove
write = agent
writetimeout = 1000
